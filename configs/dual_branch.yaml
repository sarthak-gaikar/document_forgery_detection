# configs/dual_branch.yaml - Model D: Proposed dual-branch network (PROPOSED)
defaults:
  - base

model:
  name: dual_branch_forgery_net
  type: multitask
  rgb_encoder: resnet34
  rgb_encoder_weights: imagenet
  freq_channels: 30
  srm_channels: 3
  fusion: gated_multiscale
  decoder: unetplusplus
  classes: 1

training:
  batch_size: 8
  lr: 8.0e-5
  epochs: 60
  alpha_cls: 0.5
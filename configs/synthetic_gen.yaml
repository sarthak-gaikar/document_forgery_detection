# configs/synthetic_gen.yaml - Synthetic dataset generation settings
synthetic:
  seed: 42
  n_source_docs: 15000
  target_total: 55000
  output_dir: data/synthetic/

  doc_types:
    - receipt
    - invoice
    - form
    - certificate
    - marksheet

  fonts_dir: assets/fonts/
  backgrounds_dir: assets/backgrounds/

  tamper_types:
    - text_replacement
    - copy_move
    - splicing
    - text_insertion
    - text_removal

  holdout_tamper_type: splicing

  jpeg_recompression:
    enabled: true
    q_min: 60
    q_max: 95

  image_size:
    - 1240
    - 1754